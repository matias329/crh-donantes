name: PostgreSQL integration
on:
  push:
    branches: [codex/postgres-gratuito]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: crh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: SQLite and HTTP regression
        run: python -m unittest -v test_app.py test_feedback_offline.py test_database.py
      - name: Real PostgreSQL and migration
        env:
          DATABASE_URL: postgresql://test:integration-only@localhost:5432/crh_test
          DATABASE_URL_UNPOOLED: postgresql://test:integration-only@localhost:5432/crh_test
          FLASK_SECRET_KEY: integration-key-not-used-in-production
        run: python -m unittest -v test_postgres_integration.py
