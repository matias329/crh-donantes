services:
  - type: web
    name: crh-donantes
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 app:app
    envVars:
      - key: APP_ENV
        value: production
      - key: TZ
        value: America/Argentina/Jujuy
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
