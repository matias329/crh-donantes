{% extends "base.html" %}
{% block titulo %}Nueva contraseña · CRH Jujuy{% endblock %}
{% block contenido %}
<section class="seccion" style="padding-top:24px;">
  <div class="envoltorio" style="max-width:420px;">
    <h1 style="font-size:1.8rem;">Elegí tu nueva contraseña</h1>
    <p class="parrafo-guia">Hola {{ nombre.split(' ')[0] }}, definí una nueva contraseña para tu cuenta.</p>

    <form class="formulario" method="POST" style="max-width:100%;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="campo">
        <label for="password">Nueva contraseña</label>
        <input type="password" id="password" name="password" minlength="10" required autofocus>
      </div>
      <div class="campo">
        <label for="confirmar_password">Confirmar contraseña</label>
        <input type="password" id="confirmar_password" name="confirmar_password" minlength="10" required>
      </div>
      <button type="submit" class="boton boton-primario boton-bloque">Guardar nueva contraseña</button>
    </form>
  </div>
</section>
{% endblock %}
