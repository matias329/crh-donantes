{% extends "base.html" %}
{% block titulo %}Recuperar contraseña · CRH Jujuy{% endblock %}
{% block contenido %}
<section class="seccion" style="padding-top:24px;">
  <div class="envoltorio" style="max-width:420px;">
    <h1 style="font-size:1.8rem;">Recuperar contraseña</h1>
    <p class="parrafo-guia">
      Ingresá el correo con el que te registraste y te enviaremos un enlace
      para crear una nueva contraseña.
    </p>

    <form class="formulario" method="POST" style="max-width:100%;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <button type="submit" class="boton boton-primario boton-bloque">Enviar enlace de recuperación</button>
      <p class="ayuda" style="text-align:center; margin-top:14px;">
        <a href="{{ url_for('login') }}">Volver a ingresar</a>
      </p>
    </form>
  </div>
</section>
{% endblock %}
